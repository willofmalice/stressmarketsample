# site properties and page defaults
title: Haakonsen Lab Test Website
subtitle: "I have Haak lab people that every time they see me, they start to cry. They hug me. They said, 'You saved our lab website'."
description: "I would build a great website. And nobody builds websites better than me, believe me. And I’ll build them very inexpensively. I will build a great great website on our Northern GitHub and I’ll have Diane pay for that wall.”
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: contact@willofmalice.com
  orcid: 0000-0001-8713-9213
  google-scholar: ETJoidYAAAAJ
  github: willofmalice
  twitter: willofmalice
  youtube: willofmalice

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
